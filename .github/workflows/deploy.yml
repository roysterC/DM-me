# Tests every push to main, then deploys exactly that commit to the VPS (deploy/update.sh there).
# One-time setup: run deploy/enable-auto-deploy.sh on the server and add the secrets it prints
# (VPS_HOST, VPS_SSH_KEY, VPS_KNOWN_HOSTS, and VPS_PORT if SSH isn't on 22).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run (test, then deploy) at a time; a newer push waits for the running one instead of cutting
# it off, and only the newest waiting push runs next.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # The same checks as every pull request (ci.yml), on exactly the commit being deployed.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the secrets are set
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -n "$HOST" ] || missing+=(VPS_HOST)
          [ -n "$KEY" ] || missing+=(VPS_SSH_KEY)
          [ -n "$KNOWN_HOSTS" ] || missing+=(VPS_KNOWN_HOSTS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}. Run deploy/enable-auto-deploy.sh on the server and add what it prints."
            exit 1
          fi

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          dir="$RUNNER_TEMP/ssh"
          install -m 700 -d "$dir"
          printf '%s\n' "$KEY" > "$dir/deploy_key"
          chmod 600 "$dir/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          # The key may only run deploy/update.sh on the server. It deploys the commit named here
          # (the one tested above, even if main has moved on since), builds it in its own folder,
          # switches over and checks the app answers, going back to the previous version if not.
          # Its exit status fails this step if anything breaks.
          ssh -T -i "$dir/deploy_key" -p "$PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
            -o ServerAliveInterval=30 -o ConnectTimeout=20 \
            "dm-me-deploy@$HOST" "deploy $GITHUB_SHA"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/ssh/deploy_key"
